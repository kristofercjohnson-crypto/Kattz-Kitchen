<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get Saucy | Favorite Food Spots</title><style>
:root{color-scheme:dark}body{background:#0b0a08;color:#fff0d0;font:15px Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 15px}a{color:#ffd36b}header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}h1,h2{color:#e8b84e}section,article{background:#19150e;border:1px solid #80602b;border-radius:12px;padding:15px;margin:12px 0}button,select,textarea{font:inherit;border-radius:7px;padding:9px;background:#292116;color:#fff0d0;border:1px solid #aa843d}button{cursor:pointer}textarea{width:95%;min-height:65px}label{display:block;margin:8px 0}.muted{color:#c9baa0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none}#status{min-height:20px}
</style></head><body><header><a href="index.html">GET SAUCY · Home</a><nav><a href="profile.html">My Profile</a> · <a href="locator.html">Food Map</a></nav></header>
<h1>My Favorite Food Spots</h1><p>Save restaurants, food trucks, and caterers. Give a one-to-five-star rating and share a written review.</p><p id="status" role="status"></p>
<section id="signin" class="hidden">Sign in to save spots or leave a review. <a href="signup.html?mode=signin">Sign in</a></section>
<section><h2>Find Food Businesses</h2><label for="category">Business type</label><select id="category"><option value="all">All businesses</option><option value="restaurant">Restaurants</option><option value="truck">Food Trucks</option><option value="cater">Caterers</option></select><div id="businesses">Loading…</div></section>
<section><h2>Saved Favorites</h2><div id="favorites">Sign in to see your favorites.</div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://tacvlueakxokrzvtxpnx.supabase.co','sb_publishable_cdyFDjwbzCdgAVpg2-nOUQ_3mz0410G');
let user=null,spots=[],favorites=new Set(),reviews=[];const $=id=>document.getElementById(id);
function msg(t){$('status').textContent=t}function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function kind(p){let s=(p.business_category||'').toLowerCase();return /truck|mobile/.test(s)?'truck':/cater/.test(s)?'cater':'restaurant'}
function button(text,fn){let b=el('button',text);b.type='button';b.onclick=fn;return b}
async function load(){try{const {data:{session}}=await db.auth.getSession();user=session?.user||null;$('signin').classList.toggle('hidden',!!user);
const {data,error}=await db.from('profiles').select('user_id,business_name,business_category,city,business_description,website,phone').eq('account_type','business').order('business_name').limit(200);if(error)throw error;spots=data||[];
const {data:r,error:re}=await db.from('food_spot_reviews').select('business_id,user_id,stars,body,created_at').limit(2000);if(re)throw re;reviews=r||[];
if(user){const {data:f,error:fe}=await db.from('favorite_food_spots').select('business_id').eq('user_id',user.id);if(fe)throw fe;favorites=new Set((f||[]).map(x=>x.business_id))}
render()}catch(e){msg('Food Spots setup needed: '+e.message)}}
async function save(p){if(!user){msg('Please sign in first.');return}try{let q=favorites.has(p.user_id)?db.from('favorite_food_spots').delete().eq('user_id',user.id).eq('business_id',p.user_id):db.from('favorite_food_spots').insert({user_id:user.id,business_id:p.user_id});let {error}=await q;if(error)throw error;if(favorites.has(p.user_id))favorites.delete(p.user_id);else favorites.add(p.user_id);render();msg('Favorites updated.')}catch(e){msg(e.message)}}
async function review(p,stars,body){if(!user){msg('Please sign in first.');return}try{const {error}=await db.from('food_spot_reviews').upsert({user_id:user.id,business_id:p.user_id,stars:Number(stars),body:body.trim(),updated_at:new Date().toISOString()},{onConflict:'user_id,business_id'});if(error)throw error;msg('Review saved.');await load()}catch(e){msg(e.message)}}
function card(p){let a=el('article'),title=el('h3',p.business_name||'Food business');a.append(title,el('p',(p.business_category||'Restaurant')+' · '+(p.city||'Location not listed')));
if(p.business_description)a.append(el('p',p.business_description));
let rs=reviews.filter(r=>r.business_id===p.user_id),avg=rs.length?(rs.reduce((s,r)=>s+r.stars,0)/rs.length).toFixed(1)+' / 5 ('+rs.length+' ratings)':'No ratings yet';a.append(el('p','⭐ '+avg));
if(user)a.append(button(favorites.has(p.user_id)?'♥ Remove Favorite':'♡ Save Favorite',()=>save(p)));
if(p.website){try{let url=new URL(p.website);if(['https:','http:'].includes(url.protocol)){let link=el('a','Website');link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';a.append(link)}}catch(e){}}
if(user&&user.id!==p.user_id){let mine=rs.find(r=>r.user_id===user.id),form=el('form'),rating=el('select');rating.setAttribute('aria-label','Star rating');for(let n=1;n<=5;n++){let opt=el('option',n+' star'+(n===1?'':'s'));opt.value=n;rating.append(opt)}rating.value=mine?.stars||5;let body=el('textarea');body.maxLength=1500;body.minLength=1;body.required=true;body.placeholder='Write your experience (up to 1500 characters)';body.value=mine?.body||'';form.append(el('label','Your rating'),rating,body,button(mine?'Update Review':'Post Review',()=>{if(body.value.trim())review(p,rating.value,body.value);else msg('Please write a review.')}));a.append(form)}
if(rs.length){let h=el('h4','Customer reviews');a.append(h);for(let r of rs.slice(0,10)){let d=el('p','⭐ '+r.stars+'/5 · '+r.body);a.append(d)}}return a}
function render(){let category=$('category').value,box=$('businesses');box.replaceChildren();let shown=spots.filter(p=>category==='all'||kind(p)===category);if(!shown.length)box.append(el('p','No businesses in this category yet.'));for(let p of shown)box.append(card(p));
let f=$('favorites');f.replaceChildren();if(!user){f.append(el('p','Sign in to view saved businesses.'));return}let saved=spots.filter(p=>favorites.has(p.user_id));if(!saved.length){f.append(el('p','No saved food spots yet.'));return}for(let type of ['restaurant','truck','cater']){let group=saved.filter(p=>kind(p)===type);if(!group.length)continue;f.append(el('h3',({restaurant:'Restaurants',truck:'Food Trucks',cater:'Caterers'})[type]));for(let p of group){let row=el('div'),name=el('strong',p.business_name||'Food business');row.append(name,el('span',' · '+(p.city||'')),button('Remove',()=>save(p)));f.append(row)}}}
$('category').onchange=render;load();
</script></body></html>
